<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="TradeCatch flow: a missed call hits an idempotent webhook handler, which sends an automatic SMS to the caller and alerts the business owner">
  <defs>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
      .lbl  { fill: #c9d1d9; font-size: 13px; }
      .sub  { fill: #8b949e; font-size: 11px; }
      .cap  { fill: #6e7681; font-size: 10.5px; letter-spacing: .6px; }
      .wire { stroke: #30363d; stroke-width: 1.5; fill: none; }
      @keyframes dash { to { stroke-dashoffset: -24 } }
      .flow { stroke: #21262d; stroke-width: 1.5; fill: none; stroke-dasharray: 4 8; animation: dash 1.4s linear infinite; }
      @keyframes ring { 0%, 70%, 100% { transform: rotate(0deg) } 75% { transform: rotate(-9deg) } 80% { transform: rotate(9deg) } 85% { transform: rotate(-6deg) } 90% { transform: rotate(6deg) } }
      .shake { animation: ring 3.6s ease-in-out infinite; transform-origin: 96px 150px; }
    </style>
    <path id="q1" d="M172 150 L 300 150"/>
    <path id="q2" d="M470 150 C 520 150 530 82 600 82"/>
    <path id="q3" d="M470 150 C 520 150 530 218 600 218"/>
    <path id="q4" d="M392 118 C 392 88 448 88 448 118"/>
  </defs>

  <rect x="1" y="1" width="958" height="298" rx="14" fill="#0d1117" stroke="#30363d"/>
  <text class="mono cap" x="28" y="30">TRADECATCH  ·  MISSED-CALL RECOVERY</text>

  <use href="#q1" class="wire"/><use href="#q2" class="wire"/><use href="#q3" class="wire"/>
  <use href="#q1" class="flow"/><use href="#q2" class="flow"/><use href="#q3" class="flow"/>
  <use href="#q4" class="wire" stroke-dasharray="3 4"/>

  <g class="mono">
    <g class="shake">
      <rect x="28" y="118" width="144" height="64" rx="10" fill="#161b22" stroke="#30363d"/>
      <circle cx="52" cy="150" r="4" fill="#f85149">
        <animate attributeName="opacity" values="1;.2;1" dur="1.1s" repeatCount="indefinite"/>
      </circle>
      <text class="lbl" x="68" y="147">missed call</text>
      <text class="sub" x="68" y="164">nobody picked up</text>
    </g>
    <text class="cap" x="100" y="266" text-anchor="middle">LOST JOB</text>
  </g>

  <g class="mono">
    <rect x="300" y="112" width="170" height="76" rx="10" fill="#161b22" stroke="#58a6ff" stroke-opacity=".55"/>
    <text class="lbl" x="385" y="143" text-anchor="middle">webhook handler</text>
    <text class="sub" x="385" y="162" text-anchor="middle">idempotent · retried</text>
    <text class="sub" x="420" y="82" text-anchor="middle" fill="#d29922">retry</text>
    <text class="cap" x="385" y="266" text-anchor="middle">DUPLICATES ARE THE NORM</text>
  </g>

  <g class="mono">
    <rect x="600" y="52" width="180" height="60" rx="10" fill="#161b22" stroke="#30363d">
      <animate attributeName="stroke" values="#30363d;#3fb950;#30363d" keyTimes="0;.62;.78" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <text class="lbl" x="690" y="78" text-anchor="middle">SMS to caller</text>
    <text class="sub" x="690" y="96" text-anchor="middle">reply while it still matters</text>
  </g>

  <g class="mono">
    <rect x="600" y="188" width="180" height="60" rx="10" fill="#161b22" stroke="#30363d">
      <animate attributeName="stroke" values="#30363d;#3fb950;#30363d" keyTimes="0;.68;.84" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <text class="lbl" x="690" y="214" text-anchor="middle">lead saved</text>
    <text class="sub" x="690" y="232" text-anchor="middle">owner notified</text>
  </g>

  <g class="mono">
    <text class="cap" x="880" y="150" text-anchor="middle" fill="#3fb950">RECOVERED</text>
    <circle cx="880" cy="120" r="6" fill="#3fb950">
      <animate attributeName="opacity" values=".2;1;.2" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle r="5" fill="#f85149" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.06;.3;.34;1" dur="3.6s" repeatCount="indefinite"/>
    <animateMotion dur="3.6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.06;.32;1" calcMode="linear"><mpath href="#q1"/></animateMotion>
  </circle>
  <circle r="5" fill="#3fb950" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.42;.46;.62;.66;1" dur="3.6s" repeatCount="indefinite"/>
    <animateMotion dur="3.6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.43;.64;1" calcMode="linear"><mpath href="#q2"/></animateMotion>
  </circle>
  <circle r="5" fill="#3fb950" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.48;.52;.68;.72;1" dur="3.6s" repeatCount="indefinite"/>
    <animateMotion dur="3.6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.49;.7;1" calcMode="linear"><mpath href="#q3"/></animateMotion>
  </circle>
</svg>
